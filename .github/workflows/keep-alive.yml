name: Keep Supabase Awake

on:
  schedule:
    # Runs at 00:00 every Monday and Thursday (twice a week)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase Database
        run: |
          curl --location --request GET 'https://tiqebjoqnbaqchljigqz.supabase.co/rest/v1/sessions?select=id&limit=1' \
          --header 'apikey: ${{ secrets.SUPABASE_ANON_KEY }}' \
          --header 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}'

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Authentication Status - CloudStream TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.15);
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glowing backgrounds */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* Dynamic glow based on status */
        body.success-glow::before {
            background: radial-gradient(circle, var(--success-glow) 0%, transparent 70%);
        }
        body.error-glow::before {
            background: radial-gradient(circle, var(--danger-glow) 0%, transparent 70%);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: none; /* Controlled by JS */
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--primary-glow);
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Success & Error specific styling */
        .icon-wrapper-status {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .success-wrapper {
            background: rgba(16, 185, 129, 0.1);
            border: 1.5px solid var(--success);
            box-shadow: 0 0 20px var(--success-glow);
        }

        .error-wrapper {
            background: rgba(239, 68, 68, 0.1);
            border: 1.5px solid var(--danger);
            box-shadow: 0 0 20px var(--danger-glow);
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .checkmark {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: var(--success);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.8s 0.3s ease-out forwards;
        }

        .cross {
            width: 36px;
            height: 36px;
            stroke: var(--danger);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 24px;
        }

        .btn-success {
            background: var(--success);
            box-shadow: 0 8px 20px var(--success-glow);
        }
        .btn-success:hover {
            background: #059669;
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            box-shadow: 0 8px 20px var(--danger-glow);
        }
        .btn-danger:hover {
            background: #dc2626;
            box-shadow: 0 12px 24px rgba(239, 68, 68, 0.4);
        }

        .btn-secondary {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- 1. Success Status Card -->
    <div id="success-card" class="card">
        <div class="icon-wrapper-status success-wrapper">
            <svg class="checkmark" viewBox="0 0 24 24">
                <path d="M20 6L9 17L4 12" />
            </svg>
        </div>
        <h1>Success!</h1>
        <p class="subtitle">Hello <strong id="success-user-name" style="color:#fff;">User</strong>, you have successfully authenticated your Google account. CloudStream TV has been linked.</p>
        <div class="status-badge">✓ Connected to TV</div>
        <div style="margin-top: 24px; display: flex; gap: 12px;">
            <a href="/" class="btn btn-success" style="text-decoration: none; flex: 1; margin: 0; box-shadow: 0 8px 20px var(--success-glow);">Go to Home</a>
            <a href="/authenticate" class="btn-secondary" style="flex: 1;">Link Another TV</a>
        </div>
    </div>

    <!-- 2. Error Status Card -->
    <div id="error-card" class="card">
        <div class="icon-wrapper-status error-wrapper">
            <svg class="cross" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" />
            </svg>
        </div>
        <h1>Authentication Error</h1>
        <p class="subtitle" id="error-message-text">This session code is invalid or has expired. Please restart the login screen on your TV.</p>
        <div class="status-badge">Connection Expired</div>
        <a href="/authenticate" class="btn btn-danger">Try Again</a>
    </div>

    <script>
        // Safe URL parameter decoding helper
        function safeDecode(val) {
            if (!val) return "";
            try {
                return decodeURIComponent(val.replace(/\+/g, ' '));
            } catch (e) {
                console.error("Decoding failed for value:", val, e);
                return val;
            }
        }

        function initPage() {
            let status = null;
            let name = null;
            let message = null;
            try {
                const params = new URLSearchParams(window.location.search);
                status = params.get('status');
                name = safeDecode(params.get('name'));
                message = safeDecode(params.get('message'));
            } catch (e) {
                console.error("Failed to parse URL search parameters:", e);
            }

            const successCard = document.getElementById('success-card');
            const errorCard = document.getElementById('error-card');

            try {
                if (status === 'success') {
                    document.body.classList.add('success-glow');
                    document.body.classList.remove('error-glow');
                    if (errorCard) errorCard.style.display = 'none';
                    if (successCard) {
                        successCard.style.display = 'block';
                        if (name) {
                            const userNameEl = document.getElementById('success-user-name');
                            if (userNameEl) userNameEl.textContent = name;
                        }
                    }
                } else {
                    // Default to error card if status is missing or set to error
                    document.body.classList.add('error-glow');
                    document.body.classList.remove('success-glow');
                    if (successCard) successCard.style.display = 'none';
                    if (errorCard) {
                        errorCard.style.display = 'block';
                        if (message) {
                            const errMsgEl = document.getElementById('error-message-text');
                            if (errMsgEl) errMsgEl.textContent = message;
                        }
                    }
                }
            } catch (e) {
                console.error("UI rendering failed:", e);
                if (errorCard) errorCard.style.display = 'block';
            }
        }

        // Run immediately
        initPage();

        // Run when DOM is fully parsed
        document.addEventListener('DOMContentLoaded', initPage);

        // Run when page is shown, including back/forward history cache loads
        window.addEventListener('pageshow', initPage);
    </script>
</body>
</html>
